 <!DOCTYPE html>
<html>
<head>
    <title>Page Title</title>

    <!-- CSS Styling -->
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
        }

        p {
            font-size: 18px;
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            width: 70%;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: #0066cc;
        }

        ul {
            background-color: #e6f2ff;
            padding: 15px;
            border-radius: 8px;
        }

        ul li {
            font-size: 16px;
            color: #003366;
            margin: 5px 0;
        }

        ol {
            background-color: #fff0e6;
            padding: 15px;
            border-radius: 8px;
        }

        ol li {
            font-size: 16px;
            color: #663300;
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My name is Bilal Abid Abbasi</h1>
        <p>I am a student of Iqra University.</p>

        <h2>My Skills (Unordered List)</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>C++ Programming</li>
            <li>Problem Solving</li>
        </ul>

        <h2>My Daily Routine (Ordered List)</h2>
        <ol>
            <li>Wake up early</li>
            <li>Go to university</li>
            <li>Attend classes</li>
            <li>Practice coding</li>
            <li>Study at night</li>
        </ol>
    </div>

</body>
</html>
